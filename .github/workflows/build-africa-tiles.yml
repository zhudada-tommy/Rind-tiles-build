    steps:
      - name: Free disk space (large extracts, e.g. cn/in/id ~1.5 GB each)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Planetiler
        run: |
          curl -L -o planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.8.0/planetiler.jar

      - name: Download data sources
        run: |
          mkdir -p data/sources
          cd data/sources
          curl -L -o lake_centerline.shp.zip https://dev.maptiler.download/geodata/omt/lake_centerline.shp.zip
          curl -L -o natural_earth_vector.sqlite.zip https://dev.maptiler.download/geodata/omt/natural_earth_vector.sqlite.zip
          curl -L -o water-polygons-split-3857.zip https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          cd ../..

      - name: Download OSM data
        if: ${{ github.event.inputs.country == 'all' || github.event.inputs.country == matrix.abbr }}
        run: |
          curl -L -o ${{ matrix.abbr }}.osm.pbf ${{ matrix.pbf_url || format('https://download.geofabrik.de/{0}/{1}-latest.osm.pbf', matrix.subdir, matrix.osm) }}

      - name: Build tiles
        if: ${{ github.event.inputs.country == 'all' || github.event.inputs.country == matrix.abbr }}
        run: |
          java -Xmx6g -jar planetiler.jar \
            --osm_path=${{ matrix.abbr }}.osm.pbf \
            --bounds=${{ matrix.bounds }} \
            --output=af-${{ matrix.abbr }}.pmtiles \
            --download_dir=data/sources \
            --force

      - name: Upload artifact
        if: ${{ github.event.inputs.country == 'all' || github.event.inputs.country == matrix.abbr }}
        uses: actions/upload-artifact@v4
        with:
          name: af-${{ matrix.abbr }}.pmtiles
          path: af-${{ matrix.abbr }}.pmtiles
