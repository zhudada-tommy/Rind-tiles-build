# 第 4 批剩余国家：非洲 56 + 中美洲/加勒比 11 + 剩余欧洲 22 + 俄罗斯 + 格陵兰
# 产物统一用 af- 前缀；俄罗斯 PBF 在 Geofabrik 顶层，用 pbf_url 覆盖
