name: Build W State Tiles

on:
  workflow_dispatch:
    inputs:
      state:
        description: 'State to build (e.g. wa, or, ca) or "all"'
        required: true
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abbr: wa
            osm: washington
            bounds: "-124.7,45.5,-116.9,49.0"
          - abbr: or
            osm: oregon
            bounds: "-124.6,42.0,-116.5,46.3"
          - abbr: ca
            osm: california
            bounds: "-124.4,32.5,-114.1,42.0"
          - abbr: nv
            osm: nevada
            bounds: "-120.0,35.0,-114.0,42.0"
          - abbr: id
            osm: idaho
            bounds: "-117.2,42.0,-111.0,49.0"
          - abbr: mt
            osm: montana
            bounds: "-116.0,45.0,-104.0,49.0"
          - abbr: wy
            osm: wyoming
            bounds: "-111.0,41.0,-104.0,45.0"
          - abbr: ut
            osm: utah
            bounds: "-114.0,37.0,-109.0,41.0"
          - abbr: co
            osm: colorado
            bounds: "-109.0,37.0,-102.0,41.0"
          - abbr: az
            osm: arizona
            bounds: "-114.8,31.3,-109.0,37.0"
          - abbr: nm
            osm: new-mexico
            bounds: "-109.0,31.8,-103.0,37.0"
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Planetiler
        run: |
          curl -L -o planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.8.0/planetiler.jar

      - name: Download data sources
        run: |
          mkdir -p data/sources
          cd data/sources
          curl -L -o lake_centerline.shp.zip https://dev.maptiler.download/geodata/omt/lake_centerline.shp.zip
          curl -L -o natural_earth_vector.sqlite.zip https://dev.maptiler.download/geodata/omt/natural_earth_vector.sqlite.zip
          curl -L -o water-polygons-split-3857.zip https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          cd ../..

      - name: Download OSM data
        if: ${{ github.event.inputs.state == 'all' || github.event.inputs.state == matrix.abbr }}
        run: |
          curl -L -o ${{ matrix.abbr }}.osm.pbf https://download.geofabrik.de/north-america/us/${{ matrix.osm }}-latest.osm.pbf

      - name: Build tiles
        if: ${{ github.event.inputs.state == 'all' || github.event.inputs.state == matrix.abbr }}
        run: |
          java -Xmx6g -jar planetiler.jar \
            --osm_path=${{ matrix.abbr }}.osm.pbf \
            --bounds=${{ matrix.bounds }} \
            --output=us-w-${{ matrix.abbr }}.pmtiles \
            --download_dir=data/sources \
            --force

      - name: Verify PMTiles (header, zoom, layers)
        if: ${{ github.event.inputs.state == 'all' || github.event.inputs.state == matrix.abbr }}
        run: |
          pip install -q pmtiles
          python3 - <<'PY'
          import glob, sys
          from pmtiles.reader import Reader, MmapSource
          bad = 0
          for f in glob.glob('*.pmtiles'):
              with open(f, 'rb') as fh:
                  if fh.read(7) != b'PMTiles':
                      print('BAD magic/zero header', f); bad += 1; continue
                  fh.seek(0)
                  r = Reader(MmapSource(fh)); h = r.header(); md = r.metadata()
                  layers = [l['id'] for l in md.get('vector_layers', [])]
                  print(f, 'z%d-%d' % (h['min_zoom'], h['max_zoom']), len(layers), 'layers', layers)
                  if h['max_zoom'] < 14 or 'water' not in layers or len(layers) < 9:
                      print('BAD zoom/layers', f); bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Upload artifact
        if: ${{ github.event.inputs.state == 'all' || github.event.inputs.state == matrix.abbr }}
        uses: actions/upload-artifact@v4
        with:
          name: us-w-${{ matrix.abbr }}.pmtiles
          path: us-w-${{ matrix.abbr }}.pmtiles
