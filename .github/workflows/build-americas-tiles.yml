name: Build Americas Country Tiles

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Country to build (e.g. ca, mx, br) or "all"'
        required: true
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abbr: ca
            osm: canada
            subdir: north-america
            bounds: "-141.0,41.7,-52.6,83.1"
          - abbr: mx
            osm: mexico
            subdir: north-america
            bounds: "-118.4,14.5,-86.7,32.7"
          - abbr: ar
            osm: argentina
            subdir: south-america
            bounds: "-73.6,-55.1,-53.6,-21.8"
          - abbr: bo
            osm: bolivia
            subdir: south-america
            bounds: "-69.7,-22.9,-57.5,-9.7"
          - abbr: br
            osm: brazil
            subdir: south-america
            bounds: "-74.0,-33.8,-34.8,5.3"
          - abbr: cl
            osm: chile
            subdir: south-america
            bounds: "-75.7,-56.0,-66.4,-17.5"
          - abbr: co
            osm: colombia
            subdir: south-america
            bounds: "-79.0,-4.2,-66.9,12.5"
          - abbr: ec
            osm: ecuador
            subdir: south-america
            bounds: "-92.0,-5.0,-75.2,1.7"
          - abbr: gy
            osm: guyana
            subdir: south-america
            bounds: "-61.4,1.2,-56.5,8.6"
          - abbr: py
            osm: paraguay
            subdir: south-america
            bounds: "-62.6,-27.6,-54.3,-19.3"
          - abbr: pe
            osm: peru
            subdir: south-america
            bounds: "-81.4,-18.4,-68.7,-0.0"
          - abbr: sr
            osm: suriname
            subdir: south-america
            bounds: "-58.1,1.8,-53.9,6.0"
          - abbr: uy
            osm: uruguay
            subdir: south-america
            bounds: "-58.5,-35.0,-53.1,-30.1"
          - abbr: ve
            osm: venezuela
            subdir: south-america
            bounds: "-73.4,0.6,-59.8,12.2"
    steps:
      - name: Free disk space (Canada extract is ~6.5 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Planetiler
        run: |
          curl -L -o planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.8.0/planetiler.jar

      - name: Download data sources
        run: |
          # 带指数退避的下载：之前委内瑞拉构建曾因水域数据服务器
          # (osmdata.openstreetmap.de) 超时失败，改为最多 5 次重试
          download_with_retry() {
            local url="$1" out="$2" attempts=5 delay=10
            for i in $(seq 1 $attempts); do
              echo "下载 $out（第 $i/$attempts 次）..."
              if curl -fSL --connect-timeout 30 --max-time 1800 -o "$out" "$url" && [ -s "$out" ]; then
                echo "OK: $out"
                return 0
              fi
              echo "第 $i 次失败：$out"
              rm -f "$out"
              if [ "$i" -lt "$attempts" ]; then
                echo "${delay}s 后重试..."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            echo "ERROR: $out 下载 $attempts 次均失败" >&2
            return 1
          }
          mkdir -p data/sources
          cd data/sources
          download_with_retry https://dev.maptiler.download/geodata/omt/lake_centerline.shp.zip lake_centerline.shp.zip
          download_with_retry https://dev.maptiler.download/geodata/omt/natural_earth_vector.sqlite.zip natural_earth_vector.sqlite.zip
          download_with_retry https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip water-polygons-split-3857.zip
          # 完整性校验：防止拿到截断/损坏的 zip 就继续构建
          for z in lake_centerline.shp.zip natural_earth_vector.sqlite.zip water-polygons-split-3857.zip; do
            unzip -t "$z" > /dev/null || { echo "ERROR: $z 校验失败（文件损坏）" >&2; exit 1; }
          done
          cd ../..

      - name: Download OSM data
        if: ${{ github.event.inputs.country == 'all' || github.event.inputs.country == matrix.abbr }}
        run: |
          curl -L -o ${{ matrix.abbr }}.osm.pbf https://download.geofabrik.de/${{ matrix.subdir }}/${{ matrix.osm }}-latest.osm.pbf

      - name: Build tiles
        if: ${{ github.event.inputs.country == 'all' || github.event.inputs.country == matrix.abbr }}
        run: |
          java -Xmx6g -jar planetiler.jar \
            --osm_path=${{ matrix.abbr }}.osm.pbf \
            --bounds=${{ matrix.bounds }} \
            --output=am-${{ matrix.abbr }}.pmtiles \
            --download_dir=data/sources \
            --force

      - name: Upload artifact
        if: ${{ github.event.inputs.country == 'all' || github.event.inputs.country == matrix.abbr }}
        uses: actions/upload-artifact@v4
        with:
          name: am-${{ matrix.abbr }}.pmtiles
          path: am-${{ matrix.abbr }}.pmtiles
