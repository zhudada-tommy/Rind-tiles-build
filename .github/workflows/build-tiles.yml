name: Build NC State Tiles

on:
  workflow_dispatch:
    inputs:
      state:
        description: 'State to build (e.g. ia, mn, wi) or "all"'
        required: true
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abbr: nd
            osm: north-dakota
            bounds: "-97.2,45.9,-96.4,49.0"
          - abbr: sd
            osm: south-dakota
            bounds: "-97.2,42.5,-96.4,45.9"
          - abbr: ne
            osm: nebraska
            bounds: "-95.8,40.0,-95.3,43.0"
          - abbr: ks
            osm: kansas
            bounds: "-95.3,37.0,-94.6,40.0"
          - abbr: mn
            osm: minnesota
            bounds: "-97.2,43.5,-89.0,49.0"
          - abbr: ia
            osm: iowa
            bounds: "-96.6,40.4,-90.1,43.5"
          - abbr: mo
            osm: missouri
            bounds: "-95.8,36.0,-89.0,40.6"
          - abbr: wi
            osm: wisconsin
            bounds: "-92.9,42.5,-86.8,47.1"
          - abbr: il
            osm: illinois
            bounds: "-91.5,37.0,-87.5,42.5"
          - abbr: mi
            osm: michigan
            bounds: "-90.4,41.7,-82.4,48.3"
          - abbr: in
            osm: indiana
            bounds: "-88.1,37.8,-84.8,41.8"
          - abbr: oh
            osm: ohio
            bounds: "-84.8,38.4,-80.5,42.0"
          - abbr: ky
            osm: kentucky
            bounds: "-89.6,36.5,-82.0,39.1"
          - abbr: pa
            osm: pennsylvania
            bounds: "-80.5,39.7,-80.0,42.3"
          - abbr: nyw
            osm: new-york
            bounds: "-80.0,40.5,-79.0,45.0"
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Planetiler
        run: |
          curl -L -o planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.8.0/planetiler.jar

      - name: Download data sources
        run: |
          mkdir -p data/sources
          cd data/sources
          curl -L -o lake_centerline.shp.zip https://dev.maptiler.download/geodata/omt/lake_centerline.shp.zip
          curl -L -o natural_earth_vector.sqlite.zip https://dev.maptiler.download/geodata/omt/natural_earth_vector.sqlite.zip
          curl -L -o water-polygons-split-3857.zip https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          cd ../..

      - name: Download OSM data
        if: ${{ github.event.inputs.state == 'all' || github.event.inputs.state == matrix.abbr }}
        run: |
          curl -L -o ${{ matrix.abbr }}.osm.pbf https://download.geofabrik.de/north-america/us/${{ matrix.osm }}-latest.osm.pbf

      - name: Build tiles
        if: ${{ github.event.inputs.state == 'all' || github.event.inputs.state == matrix.abbr }}
        run: |
          java -Xmx6g -jar planetiler.jar \
            --osm_path=${{ matrix.abbr }}.osm.pbf \
            --bounds=${{ matrix.bounds }} \
            --output=us-nc-${{ matrix.abbr }}.pmtiles \
            --download_dir=data/sources \
            --force

      - name: Upload artifact
        if: ${{ github.event.inputs.state == 'all' || github.event.inputs.state == matrix.abbr }}
        uses: actions/upload-artifact@v4
        with:
          name: us-nc-${{ matrix.abbr }}.pmtiles
          path: us-nc-${{ matrix.abbr }}.pmtiles
