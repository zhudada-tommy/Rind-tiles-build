name: Build EU Country Tiles

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Country to build (e.g. uk, fr, de) or "all"'
        required: true
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abbr: uk
            osm: great-britain
            subdir: europe
            bounds: "-5.7,49.9,1.8,58.7"
          - abbr: fr
            osm: france
            subdir: europe
            bounds: "-5.1,41.3,9.6,51.1"
          - abbr: de
            osm: germany
            subdir: europe
            bounds: "5.9,47.3,15.0,55.1"
          - abbr: es
            osm: spain
            subdir: europe
            bounds: "-9.3,35.9,4.3,43.8"
          - abbr: it
            osm: italy
            subdir: europe
            bounds: "6.6,35.5,18.5,47.1"
          - abbr: nl
            osm: netherlands
            subdir: europe
            bounds: "3.4,50.8,7.2,53.6"
          - abbr: be
            osm: belgium
            subdir: europe
            bounds: "2.5,49.5,6.4,51.5"
          - abbr: ch
            osm: switzerland
            subdir: europe
            bounds: "6.0,45.8,10.5,47.8"
          - abbr: at
            osm: austria
            subdir: europe
            bounds: "9.5,46.4,17.2,49.0"
          - abbr: pl
            osm: poland
            subdir: europe
            bounds: "14.1,49.0,24.2,55.0"
          - abbr: pt
            osm: portugal
            subdir: europe
            bounds: "-9.5,36.9,-6.2,42.2"
          - abbr: se
            osm: sweden
            subdir: europe
            bounds: "11.0,55.3,24.2,69.1"
          - abbr: no
            osm: norway
            subdir: europe
            bounds: "4.6,57.9,31.2,71.2"
          - abbr: dk
            osm: denmark
            subdir: europe
            bounds: "8.1,54.6,15.2,57.8"
          - abbr: fi
            osm: finland
            subdir: europe
            bounds: "19.1,59.7,31.6,70.1"
          - abbr: ie
            osm: ireland-and-northern-ireland
            subdir: europe
            bounds: "-10.2,51.4,-6.0,55.4"
          - abbr: gr
            osm: greece
            subdir: europe
            bounds: "19.4,34.8,29.6,41.8"
          - abbr: cz
            osm: czech-republic
            subdir: europe
            bounds: "12.1,48.6,18.9,51.1"
          - abbr: hu
            osm: hungary
            subdir: europe
            bounds: "16.1,45.7,23.0,48.6"
          - abbr: ro
            osm: romania
            subdir: europe
            bounds: "20.3,43.6,30.0,48.3"
          - abbr: hr
            osm: croatia
            subdir: europe
            bounds: "13.5,42.4,19.4,46.6"
          - abbr: sk
            osm: slovakia
            subdir: europe
            bounds: "16.8,47.7,22.6,49.6"
          - abbr: si
            osm: slovenia
            subdir: europe
            bounds: "13.4,45.4,16.6,46.9"
          - abbr: bg
            osm: bulgaria
            subdir: europe
            bounds: "22.4,41.2,28.6,44.2"
          - abbr: ee
            osm: estonia
            subdir: europe
            bounds: "21.8,57.5,28.2,59.7"
          - abbr: lv
            osm: latvia
            subdir: europe
            bounds: "20.9,55.7,28.2,58.1"
          - abbr: lt
            osm: lithuania
            subdir: europe
            bounds: "20.9,53.9,26.8,56.5"
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Planetiler
        run: |
          curl -L -o planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.8.0/planetiler.jar

      - name: Download data sources
        run: |
          mkdir -p data/sources
          cd data/sources
          curl -L -o lake_centerline.shp.zip https://dev.maptiler.download/geodata/omt/lake_centerline.shp.zip
          curl -L -o natural_earth_vector.sqlite.zip https://dev.maptiler.download/geodata/omt/natural_earth_vector.sqlite.zip
          curl -L -o water-polygons-split-3857.zip https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          cd ../..

      - name: Download OSM data
        if: ${{ github.event.inputs.country == 'all' || github.event.inputs.country == matrix.abbr }}
        run: |
          curl -L -o ${{ matrix.abbr }}.osm.pbf https://download.geofabrik.de/${{ matrix.subdir }}/${{ matrix.osm }}-latest.osm.pbf

      - name: Build tiles
        if: ${{ github.event.inputs.country == 'all' || github.event.inputs.country == matrix.abbr }}
        run: |
          java -Xmx6g -jar planetiler.jar \
            --osm_path=${{ matrix.abbr }}.osm.pbf \
            --bounds=${{ matrix.bounds }} \
            --output=eu-${{ matrix.abbr }}.pmtiles \
            --download_dir=data/sources \
            --force

      - name: Verify PMTiles (header, zoom, layers)
        if: ${{ github.event.inputs.country == 'all' || github.event.inputs.country == matrix.abbr }}
        run: |
          pip install -q pmtiles
          python3 - <<'PY'
          import glob, sys
          from pmtiles.reader import Reader, MmapSource
          bad = 0
          for f in glob.glob('*.pmtiles'):
              with open(f, 'rb') as fh:
                  if fh.read(7) != b'PMTiles':
                      print('BAD magic/zero header', f); bad += 1; continue
                  fh.seek(0)
                  r = Reader(MmapSource(fh)); h = r.header(); md = r.metadata()
                  layers = [l['id'] for l in md.get('vector_layers', [])]
                  print(f, 'z%d-%d' % (h['min_zoom'], h['max_zoom']), len(layers), 'layers', layers)
                  if h['max_zoom'] < 14 or 'water' not in layers or len(layers) < 9:
                      print('BAD zoom/layers', f); bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Upload artifact
        if: ${{ github.event.inputs.country == 'all' || github.event.inputs.country == matrix.abbr }}
        uses: actions/upload-artifact@v4
        with:
          name: eu-${{ matrix.abbr }}.pmtiles
          path: eu-${{ matrix.abbr }}.pmtiles
